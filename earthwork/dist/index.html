<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#171b1a" />
    <title>Earthwork · Excavator Simulator</title>
    <meta
      name="description"
      content="Work a small construction site from the cab. Dig earth, load the dump truck, and haul your first load."
    />
    <link rel="icon" href="./assets/earthwork.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="i-excavator" viewBox="0 0 24 24">
          <path
            d="M3 15h9l1 3H3a1.5 1.5 0 0 1 0-3Zm1-1V9h5l2 5m-5-5v4m5 1 3-9 5 2 2 6m-7-8 4 4 1.5 5m-1.5 0 3-1 1 2-2 2-3-1Z"
          />
        </symbol>
        <symbol id="i-forklift" viewBox="0 0 24 24">
          <path d="M2 16v-5h6V5h5l2 6v5m-7-5h7m-5-6v6m7-8v14h5M3 16h1m3 0h4" />
          <circle cx="5.5" cy="17.1" r="2.2" />
          <circle cx="13.1" cy="17.1" r="2.45" />
        </symbol>
        <symbol id="i-truck" viewBox="0 0 24 24">
          <path d="M2 6h13l-2 7H4L2 6Zm12 4h4l3 3v3h-2m-5 0H9m-5 0H2v-3m14-3v4h5" />
          <circle cx="6.5" cy="16.5" r="2.3" />
          <circle cx="16.5" cy="16.5" r="2.3" />
        </symbol>
        <symbol id="i-flag" viewBox="0 0 24 24">
          <path d="M5 21V4m1 0c4-3 7 3 12 0v9c-5 3-8-3-12 0" />
        </symbol>
        <symbol id="i-sound" viewBox="0 0 24 24">
          <path d="m11 5-5 4H3v6h3l5 4V5Zm4 3c2 2 2 6 0 8m3-11c4 4 4 10 0 14" />
        </symbol>
        <symbol id="i-mute" viewBox="0 0 24 24">
          <path d="m11 5-5 4H3v6h3l5 4V5Zm5 5 5 5m0-5-5 5" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <path d="M8 5v14m8-14v14" stroke-width="3.2" />
        </symbol>
        <symbol id="i-help" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" />
          <path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .7-1.5 1.1-1.5 2.5M12 17h.01" />
        </symbol>
        <symbol id="i-pin" viewBox="0 0 24 24">
          <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" />
          <circle cx="12" cy="10" r="2.3" />
        </symbol>
        <symbol id="i-mouse" viewBox="0 0 24 24">
          <rect x="6" y="2" width="12" height="20" rx="6" />
          <path d="M12 5v5" />
        </symbol>
        <symbol id="i-bucket" viewBox="0 0 24 24">
          <path d="m5 6 3 5 1 7c4 3 9 0 11-3l-6 1-2-8-4-4-3 2Z" />
          <circle cx="8" cy="7.5" r=".65" />
        </symbol>
        <symbol id="i-depth" viewBox="0 0 24 24">
          <path d="M4 4h16M4 20h16M12 7v10m-4-4 4 4 4-4" />
        </symbol>
        <symbol id="i-gauge" viewBox="0 0 24 24">
          <path d="M4 18a9 9 0 1 1 16 0H4Zm8-4 4-5" />
        </symbol>
        <symbol id="i-cross" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
        <symbol id="i-target" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="7" />
          <path d="M12 2v5m0 10v5M2 12h5m10 0h5" />
        </symbol>
        <symbol id="i-controls" viewBox="0 0 24 24">
          <path d="M3 7h7m5 0h6M3 17h11m5 0h2" />
          <circle cx="12.5" cy="7" r="2.5" />
          <circle cx="16.5" cy="17" r="2.5" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6" /></symbol>
      </defs>
    </svg>
    <header class="topbar">
      <div class="brand">
        <img src="./assets/earthwork.svg" alt="" width="40" height="40" />
        <div>
          <h1>EARTHWORK</h1>
          <span>EXCAVATOR SIMULATOR</span>
        </div>
      </div>
      <nav class="vehicle-select" aria-label="Vehicle">
        <button id="choose-excavator" aria-pressed="true" title="Operate the excavator (V)">
          <svg class="icon"><use href="#i-excavator" /></svg><span>Excavator</span></button
        ><button id="choose-truck" aria-pressed="false" title="Drive the dump truck (V)">
          <svg class="icon"><use href="#i-truck" /></svg><span>Dump truck</span>
        </button>
        <button id="choose-forklift" aria-pressed="false" title="Operate the forklift (V)">
          <svg class="icon"><use href="#i-forklift" /></svg><span>Forklift</span>
        </button>
      </nav>
      <div class="top-tools">
        <span class="site-name"
          ><svg class="icon"><use href="#i-pin" /></svg> North Yard</span
        ><span class="tool-rule"></span
        ><button
          id="sound"
          class="icon-button"
          aria-label="Mute sound"
          aria-pressed="true"
          title="Mute sound (M)"
        >
          <svg class="icon"><use href="#i-sound" /></svg></button
        ><button id="pause" class="icon-button" aria-label="Pause simulation" title="Pause (P)">
          <svg class="icon"><use href="#i-pause" /></svg></button
        ><button
          id="help"
          class="icon-button"
          aria-label="Operator guide"
          title="Operator guide (H)"
        >
          <svg class="icon"><use href="#i-help" /></svg>
        </button>
      </div>
    </header>
    <main id="viewport" aria-label="North Yard construction simulator">
      <canvas
        id="scene"
        aria-label="First-person construction site. Click ground or the truck bed to aim, or drag to look around."
        tabindex="0"
      ></canvas>
      <div class="lens-shade" aria-hidden="true"></div>
      <section class="objective hud-panel" aria-labelledby="task-title">
        <div class="eyebrow">
          <svg class="icon"><use href="#i-flag" /></svg><span>SITE OBJECTIVE</span>
        </div>
        <h2 id="task-title">First haul</h2>
        <p id="task-description">Load 2.0 m³ of earth into the dump truck.</p>
        <div class="progress-row">
          <div
            class="progress-track"
            role="progressbar"
            aria-label="Objective progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="task-progress"></div>
          </div>
          <strong id="task-percent">0%</strong>
        </div>
        <button id="aim-assist" class="aim-assist" hidden>
          <svg class="icon"><use href="#i-target" /></svg><span>Aim at truck bed</span>
        </button>
        <div
          id="excavator-modes"
          class="excavator-modes"
          role="group"
          aria-label="Excavator controls"
        >
          <button id="dig-mode" type="button" aria-pressed="true" title="Operate the arm (T)">
            Dig
          </button>
          <button id="drive-mode" type="button" aria-pressed="false" title="Drive the tracks (T)">
            Drive
          </button>
        </div>
      </section>
      <div class="compass" aria-label="Compass">
        <div id="bearings"></div>
        <span class="compass-index"></span>
      </div>
      <div class="view-label"><i></i><span id="view-name">CAB VIEW</span></div>
      <div id="hint" class="look-hint">
        <svg class="icon"><use href="#i-mouse" /></svg
        ><span>Drag to look <b>·</b> Click to aim</span>
      </div>
      <section class="instruments hud-panel" aria-label="Vehicle instruments">
        <div>
          <span class="readout-label"
            ><svg class="icon" id="load-icon"><use href="#i-bucket" /></svg
            ><span id="load-label">Bucket load</span></span
          ><strong id="load-value">0<span>%</span></strong>
          <div class="load-ticks" id="load-ticks" aria-hidden="true"></div>
          <small id="fork-spacing" title="Distance between the centers of the forks" hidden></small>
        </div>
        <div>
          <span class="readout-label"
            ><svg class="icon" id="secondary-icon"><use href="#i-depth" /></svg
            ><span id="secondary-label">Dig depth</span></span
          ><strong id="secondary-value">0.0<span>m</span></strong
          ><small id="secondary-note">BELOW GRADE</small>
        </div>
      </section>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="loading" class="loading">
        <div class="loader-mark"></div>
        <span>Starting North Yard…</span>
      </div>
    </main>
    <footer class="control-deck">
      <div class="deck-head">
        <svg class="icon"><use href="#i-controls" /></svg>
        <div><span>OPERATOR</span><strong>Controls</strong></div>
      </div>
      <div id="control-groups" class="control-groups"></div>
      <button id="action" class="action" title="Operate bucket (Space)">
        <svg class="icon" id="action-icon"><use href="#i-bucket" /></svg
        ><span id="action-label">Scoop soil</span><kbd>SPACE</kbd>
      </button>
    </footer>
    <dialog id="dialog" aria-labelledby="dialog-heading">
      <div class="dialog-head">
        <span class="eyebrow" id="dialog-tag">OPERATOR GUIDE</span
        ><button id="close-dialog" class="icon-button" aria-label="Close dialog">
          <svg class="icon"><use href="#i-cross" /></svg>
        </button>
      </div>
      <h2 id="dialog-heading"></h2>
      <div id="dialog-body"></div>
      <div id="dialog-actions"></div>
    </dialog>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
